services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-0}:5432"
    environment:
      POSTGRES_USER: engine_user
      POSTGRES_PASSWORD: engine_local_dev_password
      POSTGRES_DB: engine_dev_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engine_user -d engine_dev_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-0}:6379"

volumes:
  postgres_data:
